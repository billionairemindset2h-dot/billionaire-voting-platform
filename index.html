<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Billionaire Mindset Voting</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: #0b1f4d;
      color: white;
      padding: 28px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    header p {
      color: #d4af37;
      font-size: 16px;
    }

    .hero {
      text-align: center;
      padding: 45px 20px 20px;
      background: white;
    }

    .hero h2 {
      color: #0b1f4d;
      font-size: 32px;
      margin-bottom: 12px;
    }

    .hero p {
      max-width: 650px;
      margin: auto;
      line-height: 1.6;
      color: #555;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 20px;
    }

    .event-card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .event-card h3 {
      color: #0b1f4d;
      font-size: 25px;
      margin-bottom: 10px;
    }

    .event-description {
      color: #666;
      margin-bottom: 25px;
    }

    .contestant {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .contestant h4 {
      color: #0b1f4d;
      font-size: 21px;
      margin-bottom: 6px;
    }

    .code {
      display: inline-block;
      background: #eef2ff;
      color: #0b1f4d;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .votes {
      color: #666;
      margin-bottom: 15px;
    }

    .vote-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .vote-row label {
      font-weight: bold;
    }

    .vote-input {
      width: 90px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    .vote-button {
      padding: 11px 20px;
      background: #d4af37;
      border: none;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
    }

    .vote-button:hover {
      background: #c29d2f;
    }

    .loading,
    .error,
    .empty {
      text-align: center;
      padding: 25px;
    }

    .error {
      color: #b91c1c;
    }

    footer {
      text-align: center;
      padding: 25px;
      margin-top: 40px;
      background: #0b1f4d;
      color: white;
    }
.payment-success {
  background: #e8f7ee;
  border: 1px solid #2e8b57;
  color: #155724;
  padding: 12px 16px;
  margin: 0 0 18px 0;
  border-radius: 10px;
  font-size: 15px;
  line-height: 1.4;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

.payment-success h3 {
  margin: 0 0 5px;
  font-size: 18px;
}

.payment-success p {
  margin: 4px 0;
}

@media (max-width: 600px) {
  .payment-success {
    padding: 10px 12px;
    font-size: 14px;
    margin-bottom: 14px;
  }

  .payment-success h3 {
    font-size: 16px;
  }
} 
  </style>
</head>

<body>

<header>
  <h1>BILLIONAIRE MINDSET</h1>
  <p>Online Voting Platform</p>
</header>

<section class="hero">
  <h2>Vote for Your Favourite Contestant</h2>
  <p>
    Select a contestant and choose how many votes you would like to cast.
  </p>
</section>

<main class="container">
  <div id="app" class="event-card">
    <div class="loading">Loading voting information...</div>
  </div>
</main>

<footer>
  &copy; 2026 Billionaire Mindset. All rights reserved.
</footer>
