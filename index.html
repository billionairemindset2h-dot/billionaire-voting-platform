  // Our test event created earlier

  async function loadVotingPage() {
    const app = document.getElementById("app");

    try {
      const { data: event, error: eventError } = await db
        .from("events")
        .select("*")
        .eq("id", EVENT_ID)
        .eq("is_active", true)
        .single();

      if (eventError) throw eventError;

      const { data: contestants, error: contestantError } = await db
        .from("contestants")
        .select("*")
        .eq("event_id", EVENT_ID)
        .eq("is_active", true)
        .order("vote_count", { ascending: false });

      if (contestantError) throw contestantError;

      let html = `
        <h3>${escapeHtml(event.name)}</h3>

        <p class="event-description">
          ${escapeHtml(event.description || "")}
        </p>

        <p>
          <strong>Price per vote:</strong>
          ${escapeHtml(event.currency)} ${Number(event.vote_price).toFixed(2)}
        </p>

        <br>
      `;

      if (!contestants || contestants.length === 0) {
        html += `
          <div class="empty">
            No contestants are available at the moment.
          </div>
        `;
      } else {
        contestants.forEach(contestant => {
          html += `
            <div class="contestant">

              <h4>${escapeHtml(contestant.name)}</h4>

              <span class="code">
                Code: ${escapeHtml(contestant.code)}
              </span>

              <p class="votes">

              <div class="vote-row">

                  Number of votes:
                </label>

                <input
                  id="votes-${contestant.id}"
                  class="vote-input"
                  type="number"
                  min="1"
                  value="1"
                >

                <button
                  class="vote-button"
                  onclick="prepareVote('${contestant.id}', '${escapeJs(contestant.name)}', ${Number(event.vote_price)}, '${escapeJs(event.currency)}')"
                >
                  VOTE NOW
                </button>

              </div>

            </div>
          `;
        });
      }

      app.innerHTML = html;

    } catch (error) {
      console.error(error);

      app.innerHTML = `
        <div class="error">
          <h3>Unable to load voting information</h3>
          <p>Please try again later.</p>
        </div>
      `;

}
async function handlePaymentReturn() {
  const params = new URLSearchParams(window.location.search);
  const reference = params.get("reference");

  if (!reference) {
    return;
  }

  try {
    const { data, error } = await db.functions.invoke(
      "verify-paystack-payment",
      {
        body: {
          reference: reference
        }
      }
    );

    if (error) {
      throw error;
    }

    if (data && data.success) {
      alert(
        `Payment successful! ${data.votes || 0} vote(s) have been recorded.`
      );
    } else {
      alert(
        data?.message || "Payment could not be verified. Please contact the administrator."
      );
    }
  } catch (error) {
    console.error("Payment verification error:", error);
    alert(
      "We could not verify your payment. Please contact the administrator."
    );
  }

  window.history.replaceState(
    {},
    document.title,
    window.location.pathname
  );
}
function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
  function escapeJs(value) {
  return String(value ?? "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/\r/g, "\\r")
    .replace(/\n/g, "\\n");
}
window.addEventListener("load", () => {
  loadVotingPage();
  handlePaymentReturn();
});
